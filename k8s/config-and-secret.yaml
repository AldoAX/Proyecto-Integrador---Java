apiVersion: v1
kind: ConfigMap
metadata:
  name: retailorder-config
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
  LOG_LEVEL: "INFO"
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:retaildb"
  SPRING_DATASOURCE_DRIVER: "org.h2.Driver"
  SPRING_H2_CONSOLE_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: retailorder-secret
type: Opaque
data:
  # Valores en base64 — se deben reemplazar por los reales del proyecto
  # Generar con: echo -n 'valor' | base64
  DB_PASSWORD: ""
  DB_USERNAME: c2E=
  API_KEY: cmV0YWlsLXNlY3JldC1rZXk=
