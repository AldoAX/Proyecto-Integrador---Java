# Configuración de la aplicación
spring.application.name=retail-order-service
 
# Configuración de la base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# Habilitar consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-h2.sql
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%-25thread] %logger{30} - %msg%n
logging.file.name=logs/retail-logs.txt
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%-25thread] %logger{30} - %msg%n